<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>42sh — Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #0d1117;
      --sb-bg:       #161b22;
      --border:      #30363d;
      --text:        #e6edf3;
      --muted:       #8b949e;
      --accent:      #58a6ff;
      --green:       #7ee787;
      --orange:      #ffa657;
      --red:         #ff7b72;
      --purple:      #d2a8ff;
      --code-bg:     #161b22;
      --hover:       rgba(177,186,196,0.08);
      --active-bg:   rgba(88,166,255,0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.7;
    }

    /* ── LAYOUT ───────────────────────────────────────────────────────────── */
    .layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SIDEBAR ──────────────────────────────────────────────────────────── */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--sb-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sb-header {
      padding: 24px 20px 18px;
      border-bottom: 1px solid var(--border);
    }

    .sb-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .sb-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #58a6ff18, #7ee78718);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .sb-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .sb-title span { color: var(--accent); }

    .sb-meta {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7;
    }

    .sb-meta b { color: var(--orange); }

    /* ── SECTION LABEL ────────────────────────────────────────────────────── */
    .sb-section {
      padding: 18px 20px 0;
    }

    .sb-section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 0 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .sb-section-label .lbl-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sb-section.core .sb-section-label { color: var(--orange); }
    .sb-section.core .lbl-dot          { background: var(--orange); }
    .sb-section.test .sb-section-label { color: var(--green); }
    .sb-section.test .lbl-dot          { background: var(--green); }

    /* ── NAV ITEMS ────────────────────────────────────────────────────────── */
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      margin: 1px 8px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
      text-decoration: none;
      color: var(--text);
    }

    .nav-item:hover  { background: var(--hover); }

    .nav-item.active {
      background: var(--active-bg);
      border-color: rgba(88,166,255,0.2);
      color: var(--accent);
    }

    .nav-icon {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
      width: 14px;
      text-align: center;
    }

    .sb-section.core .nav-item .nav-icon { color: var(--orange); opacity: 0.7; }
    .sb-section.test .nav-item .nav-icon { color: var(--green);  opacity: 0.7; }
    .nav-item.active .nav-icon           { color: var(--accent); opacity: 1; }

    .nav-name {
      font-weight: 500;
      font-size: 12.5px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-badge {
      font-size: 10px;
      color: var(--muted);
      background: rgba(177,186,196,0.08);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .nav-item.active .nav-badge {
      color: var(--accent);
      border-color: rgba(88,166,255,0.3);
      background: rgba(88,166,255,0.1);
    }

    /* ── EMPTY HINT ───────────────────────────────────────────────────────── */
    .nav-empty {
      margin: 4px 8px 8px;
      padding: 10px 14px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(177,186,196,0.04);
      border: 1px dashed var(--border);
      border-radius: 6px;
      line-height: 1.6;
    }

    .nav-empty::before {
      content: '/* ';
      color: var(--border);
    }
    .nav-empty::after {
      content: ' */';
      color: var(--border);
    }

    /* ── FOOTER ───────────────────────────────────────────────────────────── */
    .sb-footer {
      margin-top: auto;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      line-height: 1.9;
    }

    .sb-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .sb-footer a:hover { text-decoration: underline; }

    /* ── MAIN ─────────────────────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      flex-shrink: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .topbar-project { color: var(--accent); font-weight: 600; }
    .topbar-sep     { color: var(--border); }
    #topbar-section { color: var(--muted); }
    #topbar-page    { color: var(--text); font-weight: 500; }

    .topbar-tag {
      margin-left: auto;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .topbar-tag.core { border-color: rgba(255,166,87,0.35); color: var(--orange); }
    .topbar-tag.test { border-color: rgba(126,231,135,0.35); color: var(--green); }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 48px 64px;
    }

    .manpage-wrap { max-width: 860px; }

    /* ── WELCOME SCREEN ───────────────────────────────────────────────────── */
    .welcome {
      max-width: 600px;
      padding: 20px 0;
    }

    .welcome h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .welcome h1 span { color: var(--accent); }

    .welcome .tagline {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 40px;
    }

    .welcome-card {
      background: var(--sb-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .welcome-card:hover {
      border-color: var(--accent);
      background: rgba(88,166,255,0.04);
    }

    .welcome-card.core { border-top: 2px solid var(--orange); }
    .welcome-card.test { border-top: 2px solid var(--green); }

    .wc-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
    }

    .welcome-card.core .wc-label { color: var(--orange); }
    .welcome-card.test .wc-label { color: var(--green); }

    .wc-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .wc-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7;
    }

    .wc-count {
      display: inline-block;
      margin-top: 10px;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .welcome-card.core .wc-count { border-color: rgba(255,166,87,0.3); color: var(--orange); }
    .welcome-card.test .wc-count { border-color: rgba(126,231,135,0.3); color: var(--green); }

    .welcome-hint {
      font-size: 12px;
      color: var(--muted);
      background: var(--sb-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      line-height: 1.8;
    }

    .welcome-hint code {
      color: var(--accent);
      background: rgba(88,166,255,0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* ── LOADING / ERROR ──────────────────────────────────────────────────── */
    .state-msg {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 0;
    }

    .state-msg::before { content: '$'; color: var(--green); }

    .blink { animation: blink 1s step-end infinite; }

    @keyframes blink { 50% { opacity: 0; } }

    /* ── MAN PAGE CONTENT ─────────────────────────────────────────────────── */
    .manpage-wrap h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .manpage-wrap h1.core-title { color: var(--orange); }
    .manpage-wrap h1.test-title { color: var(--green); }

    .manpage-wrap .page-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 36px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .manpage-wrap h2 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--orange);
      margin: 36px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .manpage-wrap h2::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 14px;
      background: var(--orange);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .manpage-wrap h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin: 22px 0 8px;
      padding: 8px 12px;
      background: rgba(88,166,255,0.06);
      border-left: 2px solid var(--accent);
      border-radius: 0 4px 4px 0;
    }

    .manpage-wrap p  { margin-bottom: 10px; color: var(--text); }
    .manpage-wrap b  { color: #fff; font-weight: 600; }
    .manpage-wrap i  { color: var(--muted); font-style: italic; }

    .manpage-wrap a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.1s;
    }
    .manpage-wrap a:hover { border-bottom-color: var(--accent); }

    .manpage-wrap pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      overflow-x: auto;
      font-size: 13px;
      margin: 12px 0;
      line-height: 1.6;
    }

    .manpage-wrap dl { margin: 8px 0 10px 16px; }
    .manpage-wrap dt { font-weight: 600; color: #fff; margin-top: 8px; }
    .manpage-wrap dd { margin-left: 20px; color: var(--text); }

    .manpage-wrap hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }


    .manpage-wrap .index-section {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .manpage-wrap .index-section h2          { color: var(--muted); font-size: 10px; }
    .manpage-wrap .index-section h2::before  { background: var(--muted); }
    .manpage-wrap .index-section dl          { margin-left: 0; }
    .manpage-wrap .index-section a           { color: var(--muted); font-size: 12px; }
    .manpage-wrap .index-section a:hover     { color: var(--accent); }

    /* ── SCROLLBARS ───────────────────────────────────────────────────────── */
    .content-scroll::-webkit-scrollbar { width: 6px; }
    .content-scroll::-webkit-scrollbar-track { background: transparent; }
    .content-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── HEADING ANCHORS ──────────────────────────────────────────────────── */
    .manpage-wrap h2 { position: relative; }
    .manpage-wrap h3 { position: relative; }

    .heading-anchor {
      opacity: 0;
      font-size: 11px;
      color: var(--muted) !important;
      text-decoration: none !important;
      border-bottom: none !important;
      padding: 1px 5px;
      border-radius: 4px;
      transition: opacity 0.15s, color 0.15s;
      user-select: none;
      cursor: pointer;
      font-style: normal;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }

    /* h2 is flex — push anchor to the far right */
    .manpage-wrap h2 .heading-anchor { margin-left: auto; }

    /* h3 is block — position absolutely on the right */
    .manpage-wrap h3 .heading-anchor {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .manpage-wrap h2:hover .heading-anchor,
    .manpage-wrap h3:hover .heading-anchor { opacity: 1; }
    .heading-anchor:hover { color: var(--accent) !important; }

    /* ── COPY TOAST ───────────────────────────────────────────────────────── */
    .copy-toast {
      position: fixed;
      bottom: 24px;
      right: 28px;
      background: var(--sb-bg);
      border: 1px solid var(--border);
      color: var(--green);
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 6px;
      z-index: 9999;
      pointer-events: none;
      animation: toast-in 0.18s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    /* ── INLINE IMAGES (man2html can't carry <img>, post-processed in JS) ── */
    .doc-image-wrap {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .doc-image {
      display: block;
      max-width: 100%;
      max-height: 420px;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: zoom-in;
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
    }

    .doc-image:hover {
      box-shadow: 0 0 0 3px rgba(88,166,255,0.25), 0 8px 32px rgba(0,0,0,0.55);
      border-color: rgba(88,166,255,0.45);
      transform: translateY(-2px);
    }

    /* ── IMAGE MODAL ──────────────────────────────────────────────────────── */
    .img-modal-curtain {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .img-modal-curtain.open {
      opacity: 1;
      pointer-events: all;
    }

    .img-modal-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 90vw;
      max-height: 90vh;
      transform: scale(0.94);
      transition: transform 0.2s ease;
    }

    .img-modal-curtain.open .img-modal-inner { transform: scale(1); }

    .img-modal-img {
      display: block;
      max-width: 90vw;
      max-height: 75vh;
      border-radius: 12px;
      border: 1px solid rgba(177,186,196,0.2);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      object-fit: contain;
    }

    .img-modal-caption {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      background: rgba(22,27,34,0.85);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 14px;
      letter-spacing: 0.3px;
    }

    .img-modal-caption::before { content: '// '; color: var(--border); }

    .img-modal-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 28px;
      height: 28px;
      background: var(--sb-bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--muted);
      font-size: 14px;
      line-height: 26px;
      text-align: center;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .img-modal-close:hover { color: var(--text); border-color: var(--accent); }
  </style>
</head>
<body>

<div class="layout">

  <!-- ── SIDEBAR ─────────────────────────────────────────────────────────── -->
  <aside class="sidebar">

    <div class="sb-header">
      <div class="sb-logo">
        <div class="sb-logo-icon">$_</div>
        <div>
          <div class="sb-title"><span>42sh</span></div>
        </div>
      </div>
      <div class="sb-meta">
        POSIX-compliant shell · C99<br>
        <b>42school</b>/42sh
      </div>
    </div>

    <!-- Sections are injected here by buildSidebar() -->

    <div class="sb-footer">
      <div>Doxygen + man2html</div>
      <div><a href="https://github.com/pulgamecanica">github.com/pulgamecanica</a></div>
    </div>
  </aside>

  <!-- ── MAIN ───────────────────────────────────────────────────────────── -->
  <main class="main">
    <div class="topbar">
      <span class="topbar-project">42sh</span>
      <span class="topbar-sep">/</span>
      <span id="topbar-section">docs</span>
      <span class="topbar-sep">/</span>
      <span id="topbar-page">—</span>
      <span class="topbar-tag" id="topbar-tag">man(3)</span>
    </div>
    <div class="content-scroll">
      <div class="manpage-wrap" id="content">
        <div class="state-msg">loading<span class="blink">_</span></div>
      </div>
    </div>
  </main>

</div>

<!-- ── IMAGE MODAL ────────────────────────────────────────────────────────── -->
<div class="img-modal-curtain" id="img-modal" role="dialog" aria-modal="true">
  <div class="img-modal-inner" id="img-modal-inner">
    <div class="img-modal-close" id="img-modal-close" title="Close (Esc)">✕</div>
    <img class="img-modal-img" id="img-modal-img" src="" alt="">
    <div class="img-modal-caption" id="img-modal-caption"></div>
  </div>
</div>

<script>
  /* ── state ─────────────────────────────────────────────────────────────── */
  let currentSection = null;   /* 'core' | 'test' */
  let allPages = { core: [], test: [] };

  /* ── URL hash helpers ────────────────────────────────────────────────────
   *  Hash format:  #<section>/<pagename>[/<heading-id>]
   *  Examples:     #test/test_dlist
   *                #core/ft_lstnew/synopsis
   * ───────────────────────────────────────────────────────────────────── */
  function parseHash() {
    const h = location.hash.slice(1);
    if (!h) return null;
    const parts = h.split('/');
    if (parts.length < 2) return null;
    const section = parts[0];
    if (section !== 'core' && section !== 'test') return null;
    const name   = decodeURIComponent(parts[1]);
    const anchor = parts[2] ? decodeURIComponent(parts[2]) : null;
    return { section, name, file: section + '/' + name + '.html', anchor };
  }

  function setHash(section, name, anchor, replace) {
    const hash = '#' + section + '/' + encodeURIComponent(name)
               + (anchor ? '/' + encodeURIComponent(anchor) : '');
    if (replace) history.replaceState({ section, name, anchor: anchor || null }, '', hash);
    else         history.pushState(  { section, name, anchor: anchor || null }, '', hash);
  }

  /* ── show toast notification ─────────────────────────────────────────── */
  function showToast(msg) {
    const old = document.querySelector('.copy-toast');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'copy-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  /* ── inject §-anchor links into rendered headings ────────────────────── */
  function addHeadingAnchors(section, pageName) {
    const wrap = document.getElementById('content');
    wrap.querySelectorAll('h2, h3').forEach(heading => {
      /* build a slug from visible text, ignoring any child elements */
      const slug = Array.from(heading.childNodes)
        .filter(n => n.nodeType === 3)   /* text nodes only */
        .map(n => n.textContent)
        .join('')
        .trim()
        .replace(/[^a-z0-9\s]/gi, '')
        .trim()
        .replace(/\s+/g, '-')
        .toLowerCase();
      if (!slug) return;

      heading.id = slug;

      const link = document.createElement('a');
      link.className = 'heading-anchor';
      link.href = '#' + slug;
      link.textContent = '§';
      link.title = 'Copy link to this section';

      link.addEventListener('click', e => {
        e.preventDefault();
        setHash(section, pageName, slug, /* replace */ true);
        navigator.clipboard.writeText(location.href).catch(() => {});
        showToast('Link copied!');
        heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      heading.appendChild(link);
    });
  }

  /* ── resolve a man2html cgi-bin href to a local path ───────────────────── */
  function resolveHref(href, section) {
    const m = href.match(/\/cgi-bin\/man\/man2html\?(\d+)\+([^"&\s]+)/);
    if (!m) return null;
    return section + '/' + m[2] + '.html';
  }

  /* ── fix SEE ALSO and cgi-bin links in the rendered container ───────────── */
  function fixLinks(container, section) {
    container.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      const local = resolveHref(href, section);
      if (local) {
        a.href = '#';
        a.addEventListener('click', e => {
          e.preventDefault();
          const item = document.querySelector(`.nav-item[data-file="${local}"]`);
          loadPage(local, section, item);
        });
        return;
      }
      if (href === '/cgi-bin/man/man2html') {
        a.removeAttribute('href');
        a.style.color = 'var(--muted)';
      }
    });
  }

  /* ── parse and clean man2html output ────────────────────────────────────── */
  function parseManPage(raw) {
    const htmlStart = raw.indexOf('<!');
    const html = htmlStart >= 0 ? raw.slice(htmlStart) : raw;

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const body = doc.body;

    body.querySelectorAll('a[href="/cgi-bin/man/man2html"]').forEach(a => {
      if (a.textContent.trim() === 'Return to Main Contents') {
        /* Remove the navigation link and the <HR> that follows it */
        let next = a.nextSibling;
        while (next && next.nodeType === 3 && !next.textContent.trim())
          next = next.nextSibling;
        if (next && next.tagName === 'HR') next.remove();
        a.remove();
      } else {
        /* Keep the visible text (e.g. "man2html" in the footer sentence) */
        a.replaceWith(a.textContent);
      }
    });

    let indexEl = null;
    body.querySelectorAll('a[name="index"]').forEach(a => { indexEl = a; });

    const h1 = body.querySelector('H1');
    const titleText = h1 ? h1.textContent.trim() : '';
    const metaNode  = h1 ? h1.nextSibling : null;
    const metaText  = metaNode ? metaNode.textContent.trim() : '';
    if (h1) h1.remove();

    let mainHTML = '';
    let node = body.firstChild;
    while (node) {
      if (node === indexEl) break;
      if (node.tagName === 'HR' && !mainHTML.trim()) { node = node.nextSibling; continue; }
      mainHTML += (node.outerHTML || node.textContent);
      node = node.nextSibling;
    }

    let indexHTML = '';
    if (indexEl) {
      let n = indexEl;
      while (n) { indexHTML += (n.outerHTML || n.textContent); n = n.nextSibling; }
    }

    return { titleText, metaText, mainHTML, indexHTML };
  }

  /* ── render a parsed page into #content ─────────────────────────────────── */
  /* ── image modal ─────────────────────────────────────────────────────── */
  const imgModal    = document.getElementById('img-modal');
  const imgModalImg = document.getElementById('img-modal-img');
  const imgModalCap = document.getElementById('img-modal-caption');

  function openImgModal(src, caption) {
    imgModalImg.src = src;
    imgModalImg.alt = caption;
    imgModalCap.textContent = caption;
    imgModal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeImgModal() {
    imgModal.classList.remove('open');
    document.body.style.overflow = '';
  }

  /* Close on curtain click (but not on the inner image/caption) */
  imgModal.addEventListener('click', e => {
    if (!document.getElementById('img-modal-inner').contains(e.target))
      closeImgModal();
  });
  document.getElementById('img-modal-close').addEventListener('click', closeImgModal);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeImgModal(); });

  /* ── convert mangled image syntax left by man2html ──────────────────────
   *  Doxygen Markdown: ![alt](src)
   *  After troff + man2html:  !(src)[alt]
   *  We turn that back into a centered, clickable <img> tag.
   * ────────────────────────────────────────────────────────────────────── */
  function fixImages(html) {
    return html.replace(/!\(([^)]+)\)\[([^\]]*)\]/g, (_, src, alt) => {
      const caption = alt || src;
      return `<div class="doc-image-wrap">` +
               `<img src="${src}" alt="${caption}" class="doc-image"` +
               ` title="${caption}" data-modal-src="${src}" data-modal-cap="${caption}">` +
             `</div>`;
    });
  }

  /* Wire click handlers on all .doc-image elements after render */
  function bindImageModals(container) {
    container.querySelectorAll('.doc-image').forEach(img => {
      img.addEventListener('click', () =>
        openImgModal(img.dataset.modalSrc, img.dataset.modalCap));
    });
  }

  function render(section, pageName, parsed, anchor) {
    const { titleText, metaText, mainHTML, indexHTML } = parsed;
    const wrap = document.getElementById('content');
    const titleClass = section === 'core' ? 'core-title' : 'test-title';
    wrap.innerHTML = `
      <h1 class="${titleClass}">${titleText}</h1>
      <div class="page-meta">${metaText}</div>
      ${fixImages(mainHTML)}
      ${indexHTML ? `<div class="index-section">${fixImages(indexHTML)}</div>` : ''}
    `;
    fixLinks(wrap, section);
    addHeadingAnchors(section, pageName);
    bindImageModals(wrap);

    if (anchor) {
      const target = document.getElementById(anchor);
      if (target) {
        setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
        return;
      }
    }
    document.querySelector('.content-scroll').scrollTop = 0;
  }

  /* ── load a man page ─────────────────────────────────────────────────────
   *  pushState: pass false when restoring from popstate / initial hash load
   * ────────────────────────────────────────────────────────────────────── */
  function loadPage(file, section, navItem, anchor, pushState) {
    currentSection = section;

    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    if (navItem) navItem.classList.add('active');

    const name = (navItem
      ? navItem.dataset.name
      : file.replace(/^(core|test)\//, '').replace('.html', ''));

    document.getElementById('topbar-section').textContent = section;
    document.getElementById('topbar-page').textContent = name;
    document.title = name + ' — 42sh docs';

    const tag = document.getElementById('topbar-tag');
    tag.textContent = section === 'core' ? '42sh · core' : '42sh · tests';
    tag.className = 'topbar-tag ' + section;

    document.getElementById('content').innerHTML =
      '<div class="state-msg">loading<span class="blink">_</span></div>';

    /* Update browser URL unless we are restoring a previous history entry */
    if (pushState !== false) setHash(section, name, anchor || null, false);

    fetch(file)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(raw => render(section, name, parseManPage(raw), anchor || null))
      .catch(err => {
        document.getElementById('content').innerHTML =
          `<div class="state-msg">error loading ${file}: ${err.message}</div>`;
      });
  }

  /* ── sidebar click ───────────────────────────────────────────────────────── */
  function navigate(e, el) {
    e.preventDefault();
    loadPage(el.dataset.file, el.dataset.section, el);
  }

  /* ── build sidebar from pages object ────────────────────────────────────── */
  function addSection(label, section, pages) {
    const sidebar = document.querySelector('.sidebar');
    const footer  = sidebar.querySelector('.sb-footer');

    const wrapper = document.createElement('div');
    wrapper.className = 'sb-section ' + section;

    const lbl = document.createElement('div');
    lbl.className = 'sb-section-label';
    lbl.innerHTML = `<span class="lbl-dot"></span>${label}`;
    wrapper.appendChild(lbl);

    if (pages.length === 0) {
      const hint = document.createElement('div');
      hint.className = 'nav-empty';
      hint.textContent = section === 'core' ? 'add /** */ to includes/*.h' : 'run make html';
      wrapper.appendChild(hint);
    } else {
      pages.forEach(name => {
        const icon = section === 'core' ? 'ƒ' : '▷';
        const a = document.createElement('a');
        a.className = 'nav-item';
        a.href = '#' + section + '/' + encodeURIComponent(name);
        a.dataset.file    = section + '/' + name + '.html';
        a.dataset.section = section;
        a.dataset.name    = name;
        a.innerHTML = `
          <span class="nav-icon">${icon}</span>
          <span class="nav-name">${name}</span>`;
        a.addEventListener('click', e => navigate(e, a));
        wrapper.appendChild(a);
      });
    }

    sidebar.insertBefore(wrapper, footer);
  }

  function buildSidebar(pages) {
    addSection('42sh — Core',  'core', pages.core);
    addSection('42sh — Tests', 'test', pages.test);
  }

  /* ── welcome screen (shown before any page loads) ───────────────────────── */
  function showWelcome(pages) {
    const wrap = document.getElementById('content');
    const corePgs = pages.core.length;
    const testPgs = pages.test.length;

    const firstCore = corePgs > 0
      ? `<div class="welcome-card core" onclick="loadFirstOf('core')" style="cursor:pointer">
           <div class="wc-label">42sh — Core</div>
           <div class="wc-title">Shell internals</div>
           <div class="wc-desc">Lexer, parser, AST, executor, builtins and job control.</div>
           <div class="wc-count">${corePgs} page${corePgs !== 1 ? 's' : ''}</div>
         </div>`
      : `<div class="welcome-card core">
           <div class="wc-label">42sh — Core</div>
           <div class="wc-title">Shell internals</div>
           <div class="wc-desc">No documentation yet.<br>Add <code>/** */</code> comments to <code>includes/*.h</code>.</div>
           <div class="wc-count">0 pages</div>
         </div>`;

    const firstTest = testPgs > 0
      ? `<div class="welcome-card test" onclick="loadFirstOf('test')" style="cursor:pointer">
           <div class="wc-label">42sh — Tests</div>
           <div class="wc-title">Test suite</div>
           <div class="wc-desc">minunit framework, list, dlist, history and future modules.</div>
           <div class="wc-count">${testPgs} page${testPgs !== 1 ? 's' : ''}</div>
         </div>`
      : `<div class="welcome-card test">
           <div class="wc-label">42sh — Tests</div>
           <div class="wc-title">Test suite</div>
           <div class="wc-desc">Run <code>make html</code> to generate.</div>
           <div class="wc-count">0 pages</div>
         </div>`;

    wrap.innerHTML = `
      <div class="welcome">
        <h1><span>42sh</span> — Documentation</h1>
        <p class="tagline">POSIX-compliant shell · C99 · pulgamecanica &amp; team</p>
        <div class="welcome-grid">${firstCore}${firstTest}</div>
        <div class="welcome-hint">
          Generate docs with <code>make html</code>, then serve with
          <code>make serve</code> or <code>python3 -m http.server 8080</code>
          inside <code>docs/</code>.
        </div>
      </div>`;

    document.getElementById('topbar-section').textContent = 'docs';
    document.getElementById('topbar-page').textContent = 'welcome';
    document.title = '42sh — Documentation';
  }

  function loadFirstOf(section) {
    const pages = allPages[section];
    if (!pages || pages.length === 0) return;
    const name = pages[0];
    const file = section + '/' + name + '.html';
    const item = document.querySelector(`.nav-item[data-file="${file}"]`);
    loadPage(file, section, item);
  }

  /* ── show fatal error ────────────────────────────────────────────────────── */
  function showError(msg) {
    document.getElementById('content').innerHTML = `
      <div class="welcome">
        <h1 style="color:var(--red)">Error</h1>
        <p class="tagline" style="color:var(--muted)">${msg}</p>
        <div class="welcome-hint">
          Make sure you ran <code>make html</code> from the project root first,
          then open this page via a local HTTP server:
          <br><br><code>make serve</code>
          &nbsp;or&nbsp;
          <code>cd docs &amp;&amp; python3 -m http.server 8080</code>
        </div>
      </div>`;
  }

  /* ── browser back / forward ──────────────────────────────────────────────── */
  window.addEventListener('popstate', e => {
    const state = e.state;
    if (state && state.section && state.name) {
      const file = state.section + '/' + state.name + '.html';
      const item = document.querySelector(`.nav-item[data-file="${file}"]`);
      loadPage(file, state.section, item, state.anchor || null, /* pushState */ false);
    } else {
      /* fallback: re-parse hash (e.g. user edited the URL manually) */
      const from = parseHash();
      if (from) {
        const item = document.querySelector(`.nav-item[data-file="${from.file}"]`);
        loadPage(from.file, from.section, item, from.anchor, false);
      }
    }
  });

  /* ── boot ────────────────────────────────────────────────────────────────── */
  async function init() {
    try {
      const resp = await fetch('pages.json');
      if (!resp.ok) throw new Error('pages.json not found (HTTP ' + resp.status + ')');
      const pages = await resp.json();
      allPages = pages;
      buildSidebar(pages);

      /* If the URL already has a hash, honour it (e.g. shared/bookmarked link) */
      const fromHash = parseHash();
      if (fromHash) {
        const item = document.querySelector(`.nav-item[data-file="${fromHash.file}"]`);
        loadPage(fromHash.file, fromHash.section, item, fromHash.anchor, /* pushState */ false);
        return;
      }

      /* Auto-navigate: prefer test (already has docs), then core */
      const firstTest = pages.test.length > 0 ? pages.test[0] : null;
      const firstCore = pages.core.length > 0 ? pages.core[0] : null;

      if (firstTest) {
        const file = 'test/' + firstTest + '.html';
        const item = document.querySelector(`.nav-item[data-file="${file}"]`);
        loadPage(file, 'test', item);
      } else if (firstCore) {
        const file = 'core/' + firstCore + '.html';
        const item = document.querySelector(`.nav-item[data-file="${file}"]`);
        loadPage(file, 'core', item);
      } else {
        showWelcome(pages);
      }
    } catch (e) {
      buildSidebar({ core: [], test: [] });
      showError(e.message);
    }
  }

  init();
</script>

</body>
</html>
